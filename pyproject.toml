[project]
name = "visual-audio-overlay"
version = "0.2.3" # Keep in sync with APP_VERSION in main.py (bump for every release tag)
description = "Windows audio visualizer that renders a DirectComposition radar overlay"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PyQt6>=6.11",
    "PyQt6-WebEngine>=6.11",
    "numpy>=2.3", # First line with cp314 wheels (2.2.x has none for Python 3.14)
    "soundcard>=0.4.5",
    "pycaw>=20240210",
    "comtypes>=1.4",
    "psutil>=5.9",
]

[dependency-groups]
build = ["nuitka>=4"]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE001"]

[tool.ruff.lint.per-file-ignores]
# main.py's decorative section-banner comments (e.g. "# ── Lifecycle ──") exceed
# 120 chars; every real code line in it already fits. E501 stays on everywhere else.
"main.py" = ["E501", "E402"]
# main.py and process_loopback.py intentionally defer imports: Qt env setup /
# sys.coinit_flags must run before their respective heavy imports (see the
# comment above the coinit_flags line in process_loopback.py). E402 is disabled
# there rather than reordering code that depends on import sequencing.
"process_loopback.py" = ["E402"]

[tool.pytest.ini_options]
# `uv run pytest` executes the pytest binary (cwd not auto-added to sys.path),
# unlike `python -m pytest`; make repo-root imports (direction, audio_capture) work.
pythonpath = ["."]

