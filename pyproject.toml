[project]
name = "visual-audio-overlay"
version = "0.2.3" # Keep in sync with APP_VERSION in src/main.py (bump for every release tag)
description = "Windows audio visualizer that renders a DirectComposition radar overlay"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PyQt6>=6.11",
    "PyQt6-WebEngine>=6.11",
    "numpy>=2.3", # First line with cp314 wheels (2.2.x has none for Python 3.14)
    "soundcard>=0.4.5",
    "pycaw>=20240210",
    "comtypes>=1.4",
    "psutil>=5.9",
]

[dependency-groups]
build = ["nuitka>=4"]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE001"]

[tool.ruff.lint.per-file-ignores]
# Only src/main.py: its decorative section banners exceed the 120-char limit.
"src/main.py" = ["E501", "E402"]
# main.py / process_loopback.py defer heavy imports until after Qt env setup
# and sys.coinit_flags; E402 keeps that import ordering intact.
"src/process_loopback.py" = ["E402"]

[tool.pytest.ini_options]
# uv run pytest leaves cwd off sys.path (unlike python -m pytest); src/ holds
# the flat modules pytest imports by name.
pythonpath = ["src"]

