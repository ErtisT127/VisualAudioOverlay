name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    name: Check, test, and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install formatter and linter
        run: python -m pip install ruff==0.16.5

      - name: Verify Python formatting
        run: ruff format --check .

      - name: Block fatal Python errors
        run: ruff check --select E9,F63,F7,F82 .

      - name: Install application, test, and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt pytest

      - name: Run Python tests
        run: python -m pytest tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run dashboard tests
        run: node tests/test_dropdowns.js

      - name: Build executable
        shell: pwsh
        run: ./scripts/build_nuitka.ps1

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: VisualAudioOverlay-windows
          path: dist/nuitka/VisualAudioOverlay.exe
          if-no-files-found: error
